<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Minhas Tarefas</h1>

    <form id="form" class="form">
      <input
        type="text"
        id="input"
        class="input"
        placeholder="O que precisa ser feito?"
        autocomplete="off"
        maxlength="120"
        required
      >
      <button type="submit" class="btn-add">Adicionar</button>
    </form>

    <ul id="lista" class="lista"></ul>

    <p id="vazio" class="vazio">Nenhuma tarefa por aqui ainda.</p>

    <footer class="rodape">
      <span id="contador">0 tarefas pendentes</span>
      <button id="limpar" class="btn-limpar" type="button">Limpar concluídas</button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
